[profile]
builder = "docking"

    # DOCK-B (controller-tuning-v2-staged-multistart.md §8 step 2): larger
    # offset + non-zero heading step vs. docking_mu_0p5.toml (DOCK-A), so the
    # SCREEN/FULL-TRAIN tiers exercise the heading axis during a hold, not just
    # x/y. Distance = sqrt(1.4^2+0.8^2) = 1.61 m over T_approach=5s -> quintic
    # peak speed ~= 1.875*1.61/5 = 0.60 m/s, at the edge of but within the
    # mu=0.5 feasibility envelope (project memory: lateral Vy up to ~0.6 m/s
    # feasible); DOCK-A's peak speed is ~0.43 m/s for comparison.
    [profile.params]
    x_start = 0.0
    y_start = 0.0
    psi_start_deg = 0.0
    x_target = -1.4
    y_target = 0.8
    psi_target_deg = 25.0
    T_approach = 5.0
    T_hold = 5.0

    [profile.sweep]
    # no sweep
